<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="Kunaal Wachanekar - Human Performance & Transformation Coach. Pioneering Human Evolution through personalized coaching.">
<title>Kunaal Wachanekar | Pioneering Human Evolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #111118;
  --bg-tertiary: #1a1a24;
  --bg-card: #14141c;
  --bg-glass: rgba(20, 20, 28, 0.85);
  --accent-primary: #00d4aa;
  --accent-secondary: #00b894;
  --accent-glow: rgba(0, 212, 170, 0.15);
  --accent-warm: #ff6b35;
  --text-primary: #f0f0f5;
  --text-secondary: #a0a0b0;
  --text-muted: #6b6b7b;
  --border-subtle: rgba(255,255,255,0.06);
  --border-accent: rgba(0, 212, 170, 0.3);
  --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font-primary);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 3px; }
::selection { background: var(--accent-primary); color: var(--bg-primary); }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}
@keyframes scan {
  0% { top: 0; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}
@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes dnaSpin {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(360deg); }
}
@keyframes glowPulse {
  0%, 100% { filter: drop-shadow(0 0 5px rgba(0,212,170,0.3)); }
  50% { filter: drop-shadow(0 0 20px rgba(0,212,170,0.6)); }
}
@keyframes anatomyPulse {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.35; }
}

.animate-fade-in-up {
  animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  opacity: 0;
}
.animate-delay-1 { animation-delay: 0.1s; }
.animate-delay-2 { animation-delay: 0.2s; }
.animate-delay-3 { animation-delay: 0.3s; }
.animate-delay-4 { animation-delay: 0.4s; }
.animate-delay-5 { animation-delay: 0.5s; }

.container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.section { padding: 80px 0; position: relative; }
.section-title {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
  line-height: 1.2;
}
.section-subtitle {
  color: var(--text-secondary);
  font-size: 1.05rem;
  max-width: 600px;
  margin-bottom: 48px;
}
.text-gradient {
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.label {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent-primary);
  margin-bottom: 16px;
  padding: 6px 14px;
  border: 1px solid var(--border-accent);
  border-radius: 100px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  font-family: var(--font-primary);
  font-size: 0.9rem;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  color: var(--bg-primary);
  box-shadow: 0 4px 20px rgba(0, 212, 170, 0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0, 212, 170, 0.4);
}
.btn-secondary {
  background: transparent;
  color: var(--text-primary);
  border: 1.5px solid var(--border-subtle);
}
.btn-secondary:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}
.btn-whatsapp {
  background: #25D366;
  color: white;
  box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3);
}
.btn-whatsapp:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(37, 211, 102, 0.4);
}
.btn-outline {
  background: transparent;
  color: var(--accent-primary);
  border: 1.5px solid var(--accent-primary);
}
.btn-outline:hover {
  background: var(--accent-primary);
  color: var(--bg-primary);
}
.btn-sm { padding: 10px 20px; font-size: 0.85rem; }
.btn-lg { padding: 16px 36px; font-size: 1rem; }

.card {
  background: linear-gradient(145deg, rgba(20,20,28,0.9) 0%, rgba(15,15,22,0.95) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 32px;
  transition: var(--transition);
}
.card:hover {
  border-color: var(--border-accent);
  box-shadow: 0 0 40px rgba(0, 212, 170, 0.08);
  transform: translateY(-4px);
}

.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }

@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .section { padding: 60px 0; }
}

/* Grain Overlay */
.grain-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px 256px;
}

/* Navigation */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
  transition: var(--transition);
}
.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  padding: 0 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-primary);
  text-decoration: none;
  cursor: pointer;
}
.nav-logo span { color: var(--accent-primary); }
.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
  list-style: none;
}
.nav-links a, .nav-links button {
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-secondary);
  text-decoration: none;
  transition: var(--transition);
  position: relative;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
}
.nav-links a::after, .nav-links button::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--accent-primary);
  transition: var(--transition);
}
.nav-links a:hover, .nav-links button:hover { color: var(--text-primary); }
.nav-links a:hover::after, .nav-links button:hover::after { width: 100%; }
.nav-cta { display: none; }
.nav-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 8px;
  background: none;
  border: none;
}
.nav-toggle span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--text-primary);
  transition: var(--transition);
}

@media (max-width: 1024px) {
  .nav-links { display: none; }
  .nav-cta { display: flex; }
  .nav-toggle { display: flex; }
}

.mobile-menu {
  position: fixed;
  top: 64px;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--bg-primary);
  z-index: 999;
  padding: 40px 24px;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
}
.mobile-menu.active { transform: translateX(0); }
.mobile-menu a, .mobile-menu button {
  display: block;
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  text-decoration: none;
  padding: 16px 0;
  border-bottom: 1px solid var(--border-subtle);
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.mobile-menu a:hover, .mobile-menu button:hover { color: var(--accent-primary); }

/* Hero */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #0a0a0f 0%, #111118 50%, #0d1f1a 100%);
  padding: 100px 20px 60px;
}
.hero-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
}
.hero-particles {
  position: absolute;
  inset: 0;
}
.hero-particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: var(--accent-primary);
  border-radius: 50%;
  opacity: 0.3;
  animation: float 6s ease-in-out infinite;
}
.hero-scan-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
  opacity: 0.3;
  animation: scan 8s linear infinite;
}
.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 800px;
}
.hero-label {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent-primary);
  margin-bottom: 24px;
  padding: 8px 20px;
  border: 1px solid var(--border-accent);
  border-radius: 100px;
  background: rgba(0, 212, 170, 0.05);
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(2.5rem, 8vw, 5rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin-bottom: 20px;
}
.hero-title .line-1 { display: block; }
.hero-title .line-2 {
  display: block;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-subtitle {
  font-size: clamp(1rem, 2.5vw, 1.25rem);
  color: var(--text-secondary);
  margin-bottom: 16px;
  font-weight: 400;
}
.hero-supporting {
  font-size: 0.95rem;
  color: var(--text-muted);
  margin-bottom: 40px;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}
.hero-ctas {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-bottom: 48px;
}
.hero-stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
}
.hero-stat {
  text-align: center;
}
.hero-stat-number {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent-primary);
}
.hero-stat-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* DNA Helix */
.dna-helix-container {
  position: absolute;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
  width: 220px;
  height: 500px;
  opacity: 0.25;
  pointer-events: none;
  perspective: 800px;
}
.dna-helix-svg {
  width: 100%;
  height: 100%;
  animation: dnaSpin 20s linear infinite;
  transform-style: preserve-3d;
}
@media (max-width: 1024px) {
  .dna-helix-container { display: none; }
}

/* Body Anatomy */
.body-anatomy-container {
  position: absolute;
  left: 5%;
  top: 50%;
  transform: translateY(-50%);
  width: 200px;
  height: 420px;
  opacity: 0.2;
  pointer-events: none;
  animation: anatomyPulse 4s ease-in-out infinite;
}
.body-anatomy-svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 10px rgba(0,212,170,0.3));
}
@media (max-width: 1024px) {
  .body-anatomy-container { display: none; }
}

/* About */
.about { background: var(--bg-secondary); }
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}
.about-visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.about-photo-frame {
  width: 300px;
  height: 380px;
  border-radius: var(--radius-xl);
  background: linear-gradient(145deg, var(--bg-tertiary), var(--bg-card));
  border: 2px solid var(--border-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0, 212, 170, 0.1);
}
.about-photo-frame::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(0, 212, 170, 0.15), transparent 60%);
}
.about-photo-placeholder {
  text-align: center;
  z-index: 2;
}
.about-photo-placeholder .icon {
  font-size: 4rem;
  margin-bottom: 16px;
  opacity: 0.5;
}
.about-photo-placeholder p {
  color: var(--text-muted);
  font-size: 0.9rem;
  font-weight: 500;
}
.about-photo-ring {
  position: absolute;
  width: 340px;
  height: 340px;
  border: 1px solid var(--border-accent);
  border-radius: 50%;
  animation: rotate 30s linear infinite;
}
.about-photo-ring-2 {
  position: absolute;
  width: 380px;
  height: 380px;
  border: 1px dashed var(--border-accent);
  border-radius: 50%;
  animation: rotate 40s linear infinite reverse;
}
.about-content h2 {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 4vw, 2.5rem);
  font-weight: 700;
  margin-bottom: 8px;
}
.about-content .role {
  color: var(--accent-primary);
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 24px;
  display: block;
}
.about-content p {
  color: var(--text-secondary);
  margin-bottom: 16px;
  font-size: 0.95rem;
}
.about-highlight {
  margin-top: 32px;
  padding: 24px;
  background: linear-gradient(135deg, rgba(0, 212, 170, 0.08), rgba(0, 184, 148, 0.05));
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-lg);
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--accent-primary);
  line-height: 1.5;
}

@media (max-width: 768px) {
  .about-grid { grid-template-columns: 1fr; gap: 40px; }
  .about-photo-frame { width: 260px; height: 320px; }
  .about-photo-ring { width: 300px; height: 300px; }
  .about-photo-ring-2 { width: 340px; height: 340px; }
}

/* Method */
.method { background: var(--bg-primary); }
.method-stages {
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
}
.method-stage {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 24px;
  padding: 32px 0;
  border-bottom: 1px solid var(--border-subtle);
  position: relative;
  transition: var(--transition);
}
.method-stage:last-child { border-bottom: none; }
.method-stage:hover { background: rgba(0, 212, 170, 0.02); }
.method-stage-number {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 800;
  color: var(--accent-primary);
  opacity: 0.3;
  line-height: 1;
}
.method-stage-content h3 {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 8px;
}
.method-stage-content p {
  color: var(--text-secondary);
  font-size: 0.95rem;
}
.method-footer {
  text-align: center;
  margin-top: 40px;
  font-style: italic;
  color: var(--text-muted);
  font-size: 1rem;
}

@media (max-width: 768px) {
  .method-stage { grid-template-columns: 60px 1fr; gap: 16px; padding: 24px 0; }
  .method-stage-number { font-size: 2rem; }
}

/* Expertise / Services */
.expertise { background: var(--bg-secondary); }
.expertise-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.expertise-card {
  background: linear-gradient(145deg, rgba(20,20,28,0.9) 0%, rgba(15,15,22,0.95) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 32px;
  transition: var(--transition);
  cursor: pointer;
}
.expertise-card:hover {
  border-color: var(--border-accent);
  box-shadow: 0 0 40px rgba(0, 212, 170, 0.08);
  transform: translateY(-4px);
}
.expertise-card-icon {
  font-size: 2.5rem;
  margin-bottom: 20px;
  display: block;
}
.expertise-card h3 {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 12px;
}
.expertise-card p {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-bottom: 20px;
  line-height: 1.6;
}
.expertise-card-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

@media (max-width: 1024px) {
  .expertise-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .expertise-grid { grid-template-columns: 1fr; }
}

/* Philosophy */
.philosophy {
  background: linear-gradient(135deg, var(--bg-primary) 0%, #0d1f1a 100%);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.philosophy::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(0, 212, 170, 0.05), transparent 70%);
}
.philosophy .container { position: relative; z-index: 2; }
.philosophy h2 {
  font-family: var(--font-display);
  font-size: clamp(2rem, 6vw, 3.5rem);
  font-weight: 800;
  margin-bottom: 24px;
  line-height: 1.1;
}
.philosophy p {
  color: var(--text-secondary);
  font-size: 1.05rem;
  max-width: 700px;
  margin: 0 auto 32px;
  line-height: 1.7;
}

/* Credibility */
.credibility { background: var(--bg-primary); }
.credibility-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
.credibility-card {
  background: linear-gradient(145deg, rgba(20,20,28,0.9) 0%, rgba(15,15,22,0.95) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  text-align: center;
  transition: var(--transition);
}
.credibility-card:hover {
  border-color: var(--border-accent);
  transform: translateY(-4px);
}
.credibility-card-number {
